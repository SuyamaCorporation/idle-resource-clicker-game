<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アイドル リソース クリッカー</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @keyframes coinPop { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-60px) scale(0.5)} }
  .coin-pop { position:fixed; pointer-events:none; font-weight:bold; color:#f59e0b; animation:coinPop 0.8s ease forwards; font-size:1.1rem; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
  #click-btn:active { transform: scale(0.94); }
  .building-card { transition: box-shadow 0.15s; }
  .building-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
  .upgrade-btn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
<div class="max-w-5xl mx-auto px-4 py-6">
  <h1 class="text-3xl font-bold text-center text-yellow-400 mb-1">🪙 アイドル クリッカー</h1>
  <p class="text-center text-gray-400 text-sm mb-6">クリックしてコインを集め、建物を建てよう！</p>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- Left: Clicker -->
    <div class="lg:col-span-1 flex flex-col items-center">
      <!-- Coin display -->
      <div class="bg-gray-800 rounded-2xl p-6 w-full text-center mb-4 shadow-xl">
        <div class="text-sm text-gray-400 mb-1">所持コイン</div>
        <div id="coins-display" class="text-4xl font-bold text-yellow-400 mb-1">0</div>
        <div class="text-xs text-gray-500">総獲得: <span id="total-earned">0</span></div>
        <div class="text-xs text-gray-400 mt-1">自動生成: <span id="cps-display" class="text-green-400">0</span> /秒</div>
      </div>
      <!-- Click button -->
      <button id="click-btn" onclick="doClick(event)"
        class="w-36 h-36 rounded-full bg-gradient-to-br from-yellow-400 to-yellow-600 hover:from-yellow-300 hover:to-yellow-500 text-5xl shadow-2xl flex items-center justify-center select-none transition active:scale-95 mb-4"
        aria-label="コインをクリック">🪙</button>
      <div class="text-sm text-gray-400">クリックで <span id="click-power" class="text-yellow-400 font-bold">1</span> コイン</div>

      <!-- Save/Load -->
      <div class="flex gap-2 mt-4">
        <button onclick="saveGame()" class="bg-blue-700 hover:bg-blue-600 text-white px-4 py-1.5 rounded-lg text-sm font-semibold">保存</button>
        <button onclick="loadGame()" class="bg-green-700 hover:bg-green-600 text-white px-4 py-1.5 rounded-lg text-sm font-semibold">ロード</button>
        <button onclick="resetGame()" class="bg-red-800 hover:bg-red-700 text-white px-4 py-1.5 rounded-lg text-sm font-semibold">リセット</button>
      </div>
      <div id="save-msg" class="text-xs text-gray-500 mt-2 h-4"></div>
    </div>

    <!-- Center: Buildings -->
    <div class="lg:col-span-1">
      <h2 class="text-xl font-bold text-gray-200 mb-3">🏗 建物</h2>
      <div id="buildings-list" class="space-y-3"></div>
    </div>

    <!-- Right: Upgrades + Milestones -->
    <div class="lg:col-span-1">
      <h2 class="text-xl font-bold text-gray-200 mb-3">⚡ アップグレード</h2>
      <div id="upgrades-list" class="space-y-2 mb-6"></div>
      <h2 class="text-xl font-bold text-gray-200 mb-3">🏆 実績</h2>
      <div id="milestones-list" class="space-y-1"></div>
    </div>
  </div>
</div>

<script>
const BUILDINGS = [
  { id:'farm',    name:'🌾 農場',   baseCost:15,    baseCps:0.1,  desc:'小麦でコインを生産' },
  { id:'mine',    name:'⛏ 鉱山',   baseCost:100,   baseCps:0.5,  desc:'鉱石を採掘してコインに' },
  { id:'factory', name:'🏭 工場',   baseCost:500,   baseCps:2.0,  desc:'機械で効率的に生産' },
  { id:'bank',    name:'🏦 銀行',   baseCost:2000,  baseCps:8.0,  desc:'利子でコインが増える' },
  { id:'market',  name:'🏪 市場',   baseCost:8000,  baseCps:25.0, desc:'取引でコインを稼ぐ' },
  { id:'castle',  name:'🏰 城',     baseCost:30000, baseCps:80.0, desc:'領地からの税収' },
];

const UPGRADES = [
  { id:'u1', name:'農業改革',    cost:100,   target:'farm',    mult:2,   desc:'農場の生産量2倍', bought:false },
  { id:'u2', name:'精錬技術',    cost:500,   target:'mine',    mult:2,   desc:'鉱山の生産量2倍', bought:false },
  { id:'u3', name:'強化クリック',cost:50,    target:'click',   mult:2,   desc:'クリック力2倍', bought:false },
  { id:'u4', name:'工場自動化',  cost:3000,  target:'factory', mult:2,   desc:'工場の生産量2倍', bought:false },
  { id:'u5', name:'金融工学',    cost:12000, target:'bank',    mult:2,   desc:'銀行の生産量2倍', bought:false },
  { id:'u6', name:'クリック革命',cost:5000,  target:'click',   mult:5,   desc:'クリック力5倍', bought:false },
  { id:'u7', name:'市場支配',    cost:50000, target:'market',  mult:3,   desc:'市場の生産量3倍', bought:false },
  { id:'u8', name:'超高速クリック',cost:50000,target:'click',  mult:10,  desc:'クリック力10倍', bought:false },
];

const MILESTONES = [
  { id:'m1', name:'最初の一歩',    req: c => c >= 10,       desc:'10コイン獲得' },
  { id:'m2', name:'小さな農家',    req: s => s.buildings.farm >= 1, desc:'農場を建設' },
  { id:'m3', name:'百万長者への道',req: c => c >= 1000,     desc:'1000コイン獲得' },
  { id:'m4', name:'工業化',        req: s => s.buildings.factory >= 1, desc:'工場を建設' },
  { id:'m5', name:'クリック達人',  req: s => s.totalClicks >= 100, desc:'100回クリック' },
  { id:'m6', name:'大富豪',        req: c => c >= 1000000,  desc:'100万コイン獲得' },
  { id:'m7', name:'帝国の誕生',    req: s => s.buildings.castle >= 1, desc:'城を建設' },
];

let state;

function defaultState() {
  return {
    coins: 0, totalEarned: 0, totalClicks: 0,
    buildings: { farm:0, mine:0, factory:0, bank:0, market:0, castle:0 },
    upgrades: {},
    milestones: {},
    clickMult: 1,
  };
}

function loadGame() {
  const saved = localStorage.getItem('idle-clicker-save');
  if (saved) {
    state = JSON.parse(saved);
    showSaveMsg('ロード完了！');
  } else {
    state = defaultState();
    showSaveMsg('新しいゲームを開始');
  }
  renderAll();
}

function saveGame() {
  localStorage.setItem('idle-clicker-save', JSON.stringify(state));
  showSaveMsg('保存しました ✓');
}

function resetGame() {
  if (!confirm('ゲームをリセットしますか？')) return;
  localStorage.removeItem('idle-clicker-save');
  state = defaultState();
  showSaveMsg('リセット完了');
  renderAll();
}

function showSaveMsg(msg) {
  const el = document.getElementById('save-msg');
  el.textContent = msg;
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.textContent = ''; }, 2500);
}

function calcCPS() {
  let total = 0;
  BUILDINGS.forEach(b => {
    let cps = b.baseCps * state.buildings[b.id];
    // apply upgrades
    UPGRADES.filter(u => u.target === b.id && state.upgrades[u.id]).forEach(u => { cps *= u.mult; });
    total += cps;
  });
  return total;
}

function calcClickPower() {
  let power = 1;
  UPGRADES.filter(u => u.target === 'click' && state.upgrades[u.id]).forEach(u => { power *= u.mult; });
  return power;
}

function buildingCost(b) {
  return Math.ceil(b.baseCost * Math.pow(1.15, state.buildings[b.id]));
}

function doClick(e) {
  const power = calcClickPower();
  state.coins += power;
  state.totalEarned += power;
  state.totalClicks++;
  updateDisplay();
  checkMilestones();
  // visual pop
  const pop = document.createElement('div');
  pop.className = 'coin-pop';
  pop.textContent = '+' + power;
  pop.style.left = e.clientX + 'px';
  pop.style.top = e.clientY + 'px';
  document.body.appendChild(pop);
  setTimeout(() => pop.remove(), 800);
}

function buyBuilding(id) {
  const b = BUILDINGS.find(x => x.id === id);
  const cost = buildingCost(b);
  if (state.coins < cost) return;
  state.coins -= cost;
  state.buildings[id]++;
  updateDisplay();
  renderBuildings();
  checkMilestones();
}

function buyUpgrade(id) {
  const u = UPGRADES.find(x => x.id === id);
  if (state.upgrades[id] || state.coins < u.cost) return;
  state.coins -= u.cost;
  state.upgrades[id] = true;
  updateDisplay();
  renderUpgrades();
}

function updateDisplay() {
  const cps = calcCPS();
  const clickPow = calcClickPower();
  document.getElementById('coins-display').textContent = formatNum(state.coins);
  document.getElementById('total-earned').textContent = formatNum(state.totalEarned);
  document.getElementById('cps-display').textContent = formatNum(cps);
  document.getElementById('click-power').textContent = formatNum(clickPow);
}

function formatNum(n) {
  if (n >= 1e12) return (n/1e12).toFixed(2) + 'T';
  if (n >= 1e9) return (n/1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n/1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
  return Math.floor(n).toString();
}

function renderBuildings() {
  const container = document.getElementById('buildings-list');
  container.innerHTML = '';
  BUILDINGS.forEach(b => {
    const count = state.buildings[b.id];
    const cost = buildingCost(b);
    const canAfford = state.coins >= cost;
    let bCps = b.baseCps * count;
    UPGRADES.filter(u => u.target === b.id && state.upgrades[u.id]).forEach(u => { bCps *= u.mult; });
    const card = document.createElement('div');
    card.className = 'building-card bg-gray-800 rounded-xl p-3 flex items-center gap-3';
    card.innerHTML = `
      <div class="flex-1">
        <div class="font-bold text-sm">${b.name} <span class="text-gray-400 font-normal text-xs">${count > 0 ? '×'+count : ''}</span></div>
        <div class="text-xs text-gray-400">${b.desc}</div>
        ${count > 0 ? `<div class="text-xs text-green-400">+${formatNum(bCps)}/秒</div>` : ''}
      </div>
      <button onclick="buyBuilding('${b.id}')" ${canAfford ? '' : 'disabled'}
        class="px-3 py-2 rounded-lg text-sm font-bold transition ${canAfford ? 'bg-yellow-500 hover:bg-yellow-400 text-gray-900' : 'bg-gray-600 text-gray-400 cursor-not-allowed'}"
        aria-label="${b.name}を購入">
        🪙 ${formatNum(cost)}
      </button>
    `;
    container.appendChild(card);
  });
}

function renderUpgrades() {
  const container = document.getElementById('upgrades-list');
  container.innerHTML = '';
  UPGRADES.forEach(u => {
    const bought = !!state.upgrades[u.id];
    const canAfford = state.coins >= u.cost;
    const btn = document.createElement('div');
    btn.className = `rounded-lg p-2 text-xs flex items-center gap-2 ${bought ? 'bg-green-900/40 opacity-60' : canAfford ? 'bg-gray-700 cursor-pointer hover:bg-gray-600' : 'bg-gray-800 opacity-60'}`;
    btn.innerHTML = `
      <span class="text-base">${bought ? '✅' : canAfford ? '⚡' : '🔒'}</span>
      <div class="flex-1">
        <div class="font-semibold text-gray-200">${u.name}</div>
        <div class="text-gray-400">${u.desc}</div>
      </div>
      ${!bought ? `<span class="text-yellow-400 font-bold shrink-0">🪙${formatNum(u.cost)}</span>` : ''}
    `;
    if (!bought && canAfford) btn.onclick = () => buyUpgrade(u.id);
    container.appendChild(btn);
  });
}

function checkMilestones() {
  let changed = false;
  MILESTONES.forEach(m => {
    if (!state.milestones[m.id]) {
      const ok = m.req.length === 1 && m.req.toString().includes('state')
        ? m.req(state)
        : m.req(state.totalEarned);
      if (ok) { state.milestones[m.id] = true; changed = true; }
    }
  });
  if (changed) renderMilestones();
}

function renderMilestones() {
  const container = document.getElementById('milestones-list');
  container.innerHTML = '';
  MILESTONES.forEach(m => {
    const achieved = !!state.milestones[m.id];
    const div = document.createElement('div');
    div.className = `text-xs flex items-center gap-2 rounded-lg px-2 py-1 ${achieved ? 'bg-yellow-900/40 text-yellow-300' : 'bg-gray-800/50 text-gray-500'}`;
    div.innerHTML = `<span>${achieved ? '🏆' : '🔲'}</span><div><span class="font-semibold">${m.name}</span> — ${m.desc}</div>`;
    container.appendChild(div);
  });
}

function renderAll() {
  updateDisplay();
  renderBuildings();
  renderUpgrades();
  renderMilestones();
}

// Auto-save every 30 seconds
setInterval(() => { saveGame(); }, 30000);

// Game loop
let lastTick = Date.now();
function gameTick() {
  const now = Date.now();
  const dt = (now - lastTick) / 1000;
  lastTick = now;
  const cps = calcCPS();
  if (cps > 0) {
    state.coins += cps * dt;
    state.totalEarned += cps * dt;
  }
  updateDisplay();
  renderBuildings(); // update cost affordability
  checkMilestones();
  requestAnimationFrame(gameTick);
}

loadGame();
requestAnimationFrame(gameTick);
</script>
</body>
</html>
